spring:
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:docai}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:postgres}

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

# Gemini. Chat goes over Gemini's OpenAI-compatible endpoint (fully spec-compliant),
# but embeddings MUST use the native Google GenAI starter: Gemini's OpenAI-compatible
# /embeddings omits the `index` and `usage` fields that the official OpenAI Java SDK
# (used by Spring AI 2.x) requires, which fails with "`index` is not set".
    ai:
        model:
            # Disables the OpenAI EmbeddingModel bean so google-genai supplies it instead.
            # Chat is unaffected (it keys off spring.ai.model.chat).
            embedding: none

        openai:
            api-key: ${GEMINI_API_KEY:demo-key}
            base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
            chat:
                model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash}
                temperature: 0.2
                # Gemini 3.x models 'think' by default: ~400 tokens and 8-25s for a
                # one-line answer. 'none' cuts that to ~47 tokens. Raise to low/medium
                # if answers look shallow.
                reasoning-effort: ${GEMINI_REASONING_EFFORT:none}

        google:
            genai:
                embedding:
                    api-key: ${GEMINI_API_KEY:demo-key}
                    text:
                        model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
                        # Gemini defaults to 3072, but pgvector's HNSW index caps at 2000.
                        # 1536 scores identically to 3072 on MTEB (Matryoshka truncation).
                        dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:1536}
                        task-type: RETRIEVAL_DOCUMENT

        vectorstore:
            pgvector:
                index-type: HNSW
                distance-type: COSINE_DISTANCE
                dimensions: 1536
                table-name: vector_store
                schema-name: public
                initialize-schema: true
    
    servlet:
        multipart:
            max-file-size: 25MB
            max-request-size: 50MB
            
        
# app configurations
app:
    rag:
        chunk-size: 600
        top-k: 5
        similarity-threshold: 0.0

    cors:
        allowed-origins: "*"
        allowed-methods: GET,POST,PUT,DELETE,OPTIONS
        allowed-headers: "*"
